openapi: 3.0.3
info:
  title: FORWARD 2026 · Forward Card API
  version: 0.2.0
  description: |
    Contract between the FORWARD 2026 front end and the Forward Card backend.
    Human-readable notes (Traditional Chinese): docs/api/README.md.
    TypeScript types: src/api/types.ts. The in-browser mock (src/api/mock/server.ts)
    implements exactly this contract.
servers:
  - url: /
    description: Same origin (default)
tags:
  - name: public
  - name: admin
paths:
  /api/client-token:
    post:
      tags: [public]
      summary: Get a Client Token cookie before submitting a card
      description: |
        The browser calls this before every card submission, with credentials 'same-origin'.
        If the request already carries a valid token, nothing changes (no Set-Cookie), so a
        page reload keeps the same token and quota. Otherwise a new token is set. No body either way.
        The token is anonymous, carries no user data and is not an identity.
      operationId: getClientToken
      responses:
        '204':
          description: The browser holds a valid token (newly set or kept).
          headers:
            Set-Cookie:
              description: Only when a new token is issued.
              schema:
                type: string
                example: '__Host-fwd_ct=v1.<id>.<expiry>.<signature>; Max-Age=7200; Path=/; Secure; HttpOnly; SameSite=Strict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/cards:
    post:
      tags: [public]
      summary: Submit a Forward Card (stored as pending, never public until approved)
      description: |
        Requires the Client Token cookie from POST /api/client-token (send with credentials
        'same-origin'). Checks run in this order: fields → honeypot → Client Token → Turnstile →
        rate limits → insert. On 401 CLIENT_TOKEN_INVALID the Turnstile token has not been used
        yet, so the client fetches a new Client Token and resends the same request once.
      operationId: submitCard
      security: [{ clientToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCardRequest'
      responses:
        '201':
          description: Accepted and stored as pending. Honeypot hits also get 201 but are discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ClientTokenInvalid'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      tags: [public]
      summary: List approved cards, newest first
      operationId: listCards
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 12 }
      responses:
        '200':
          description: One page of approved cards
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=15' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/cards:
    get:
      tags: [admin]
      summary: List cards by status (max 100, newest first)
      operationId: adminListCards
      security: [{ adminToken: [] }]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CardStatus'
      responses:
        '200':
          description: Cards with the requested status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/cards/{id}/status:
    patch:
      tags: [admin]
      summary: Approve or hide a card
      operationId: adminSetStatus
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, hidden]
                from:
                  $ref: '#/components/schemas/ExpectedStatus'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/StatusChanged'
  /api/admin/cards/{id}/hide:
    patch:
      tags: [admin]
      summary: Emergency takedown (sets status to hidden; not a delete)
      operationId: adminHide
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: false
        description: Optional. Without a body the card is hidden whatever its status.
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  $ref: '#/components/schemas/ExpectedStatus'
      responses:
        '200':
          description: Hidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/StatusChanged'
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Server-side secret, at least 32 characters. Never stored by the browser.
    clientToken:
      type: apiKey
      in: cookie
      name: __Host-fwd_ct
      description: |
        Set by POST /api/client-token as an HttpOnly cookie that page scripts cannot read; expires
        after 2 hours. Format v1.<random id>.<expiry, Unix seconds>.<HMAC-SHA256 signature>; the
        server checks the signature and expiry without a database lookup.
  parameters:
    CardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,80}$'
  schemas:
    CardStatus:
      type: string
      enum: [pending, approved, hidden]
    SubmitCardRequest:
      type: object
      required: [nickname, text_gratitude, text_anticipate, agreed_to_publish, honeypot]
      properties:
        nickname:
          type: string
          description: Trimmed length 1–20 Unicode code points; no control or bidi-control characters.
          example: 小恩
        text_gratitude:
          type: string
          description: Trimmed length 1–140 code points; tab and newline allowed.
          example: 感謝神這一年的帶領
        text_anticipate:
          type: string
          description: Trimmed length 1–140 code points; tab and newline allowed.
          example: 期待 There is more！
        agreed_to_publish:
          type: boolean
          enum: [true]
        honeypot:
          type: string
          description: Always "" from real users. Non-empty → 201 but nothing is stored.
          example: ''
        turnstile_token:
          type: string
          description: Cloudflare Turnstile response; required when Turnstile is enabled.
    SubmitCardResponse:
      type: object
      required: [success, card_id]
      properties:
        success:
          type: boolean
          enum: [true]
        card_id:
          type: string
          description: c_ + UUID v4 (38 characters)
          example: c_7f3c2a9e-3b1d-4c55-9a0e-2f6f1d8b9c10
    PublicCard:
      type: object
      additionalProperties: false
      required: [id, nickname, text_gratitude, text_anticipate, created_at]
      properties:
        id: { type: string }
        nickname: { type: string }
        text_gratitude: { type: string }
        text_anticipate: { type: string }
        created_at:
          type: string
          format: date-time
    AdminCard:
      allOf:
        - $ref: '#/components/schemas/PublicCard'
        - type: object
          required: [status, moderation]
          properties:
            status:
              $ref: '#/components/schemas/CardStatus'
            moderation:
              description: The model's judgment (M1.6); null when the card was not judged, e.g. while auto-publish is off.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AdminModeration'
    AdminModeration:
      type: object
      description: Never contains card text.
      required: [model, questions_version, outcome, reason, reason_probability, needs_attention_probability, auto_published, judged_at]
      properties:
        model: { type: string, example: '@cf/cloudflare/clef' }
        questions_version:
          type: string
          nullable: true
          description: 12-character SHA-256 prefix of the questions used; null when none were configured.
        outcome:
          type: string
          enum: [clear, flagged, questions_missing, timeout, model_error, invalid_output]
          description: clear = no reason to hold the card; flagged = some reason; the rest = no usable answer, so the card stays pending.
        reason: { type: string, nullable: true }
        reason_probability: { type: number, nullable: true }
        needs_attention_probability: { type: number, nullable: true }
        auto_published:
          type: boolean
          description: True only when this judgment published the card.
        judged_at: { type: string, format: date-time }
    ExpectedStatus:
      description: |
        The status the reviewer saw when acting. With it the change applies only while the card still
        has that status; if someone else changed it first the answer is 409 CARD_STATUS_CHANGED with
        the card's status now, and nothing is overwritten. Without it the change applies regardless.
      allOf:
        - $ref: '#/components/schemas/CardStatus'
    Pagination:
      type: object
      required: [page, limit, has_more, total_count]
      properties:
        page: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
        total_count: { type: integer }
    ListCardsResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCard'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdminCard'
        has_more: { type: boolean }
    AdminStatusResponse:
      type: object
      required: [success, card_id, status]
      properties:
        success:
          type: boolean
          enum: [true]
        card_id: { type: string }
        status:
          $ref: '#/components/schemas/CardStatus'
    ApiError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - TURNSTILE_FAILED
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - CLIENT_TOKEN_INVALID
                - UNAUTHORIZED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CARD_STATUS_CHANGED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
              description: For engineers; never shown to visitors.
            fields:
              type: object
              additionalProperties:
                type: string
                enum: [required, too_long, invalid_chars, must_be_true, invalid]
            retry_after_seconds:
              type: integer
            current_status:
              description: Only on CARD_STATUS_CHANGED, the card's status now.
              allOf:
                - $ref: '#/components/schemas/CardStatus'
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: One or more fields are invalid
              fields:
                nickname: required
                text_gratitude: too_long
    ClientTokenInvalid:
      description: The Client Token cookie is missing, expired or not signed by this server. Nothing was stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error:
              code: CLIENT_TOKEN_INVALID
              message: Missing, expired or invalid client token
    Unauthorized:
      description: Missing or invalid admin token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: |
        Too many requests. Cards: per Client Token, 60 seconds after the previous card and 3 per
        clock hour; per IP, 400 per minute and 2,000 per hour. New Client Tokens: 600 per IP per
        minute. These are staging candidates, to be confirmed after the load test.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests
              retry_after_seconds: 42
    StatusChanged:
      description: |
        Someone else changed the card after the reviewer loaded it, so this change was not applied.
        current_status is the card's status now; refresh before acting again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error:
              code: CARD_STATUS_CHANGED
              message: The card was changed by someone else
              current_status: hidden
